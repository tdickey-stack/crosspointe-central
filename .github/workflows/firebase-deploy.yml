name: Deploy Firebase

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  # Both branches deploy to the same Firebase project. Serialize them so a
  # preview deploy cannot update Cloud Run services while a live deploy is
  # finalizing pinned Hosting rewrites.
  group: firebase-crosspointe-central
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Studio Functions dependencies
        run: npm ci --prefix studio-functions

      - name: Restore generated YouVersion bundle
        run: pnpm run build:youversion

      - name: Build Central Studio
        run: pnpm run build:studio

      - name: Test Studio client persistence
        run: pnpm run test:studio-client

      - name: Verify JavaScript syntax
        run: pnpm run check:syntax

      - name: Test analytics
        run: pnpm run test:analytics

      - name: Test push notifications
        run: npm --prefix functions run test:push

      - name: Write Functions environment file
        env:
          FIREBASE_FUNCTIONS_ENV: ${{ secrets.FIREBASE_FUNCTIONS_ENV }}
        run: printf '%s' "$FIREBASE_FUNCTIONS_ENV" > functions/.env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROSSPOINTE_CENTRAL }}

      - name: Deploy live Firebase project
        run: ./node_modules/.bin/firebase deploy --project crosspointe-central --only hosting,functions,firestore,storage --non-interactive

  deploy-preview:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Studio Functions dependencies
        run: npm ci --prefix studio-functions

      - name: Restore generated YouVersion bundle
        run: pnpm run build:youversion

      - name: Build Central Studio
        run: pnpm run build:studio

      - name: Test Studio client persistence
        run: pnpm run test:studio-client

      - name: Verify JavaScript syntax
        run: pnpm run check:syntax

      - name: Test analytics
        run: pnpm run test:analytics

      - name: Test push notifications
        run: npm --prefix functions run test:push

      - name: Write Functions environment file
        env:
          FIREBASE_FUNCTIONS_ENV: ${{ secrets.FIREBASE_FUNCTIONS_ENV }}
          FIREBASE_FUNCTIONS_ENV_DEV: ${{ secrets.FIREBASE_FUNCTIONS_ENV_DEV }}
        run: |
          CONTENT="$FIREBASE_FUNCTIONS_ENV"
          if [ -n "$FIREBASE_FUNCTIONS_ENV_DEV" ]; then
            CONTENT="$FIREBASE_FUNCTIONS_ENV_DEV"
          fi
          printf '%s' "$CONTENT" > functions/.env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROSSPOINTE_CENTRAL }}

      - name: Deploy unpinned Dev endpoints
        run: ./node_modules/.bin/firebase deploy --project crosspointe-central --only functions:wayfinderAlphaAccess,functions:wayfinderAlphaSettings,functions:centralPushSubscription,functions:centralPushSend,functions:centralPushSchedule,functions:centralPushDispatchScheduled --non-interactive

      - name: Deploy Firebase preview channel
        run: ./node_modules/.bin/firebase hosting:channel:deploy dev --project crosspointe-central --expires 30d --non-interactive
