<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#27272a">
    <meta
      name="description"
      content="Central Studio - CrossPointe's controlled creative workspace."
    >
    <title>Central Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style id="studio-web-fonts"></style>
    <script>
      (function() {
        var fontCssUrl =
          "https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bodoni+Moda:wght@400;500;600;700;800;900&family=EB+Garamond:wght@400;500;600;700;800&family=Forum&family=Google+Sans+Flex:wght@400;500;600;700;800;900&family=League+Gothic&family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Niconne&family=Science+Gothic:wght@400;500;600;700;800;900&family=Unbounded:wght@400;500;600;700;800;900&display=swap";
        window.CENTRAL_STUDIO_FONT_CSS_ERROR = null;
        window.CENTRAL_STUDIO_FONT_CSS_READY = fetch(fontCssUrl)
            .then(function(response) {
              if (!response.ok) {
                throw new Error("Studio fonts could not be loaded.");
              }
              return response.text();
            })
            .then(function(fontCss) {
              document.getElementById("studio-web-fonts").textContent = fontCss;
            })
            .catch(function(error) {
              window.CENTRAL_STUDIO_FONT_CSS_ERROR = error;
            });
      }());
    </script>
    <link rel="stylesheet" href="/studio.css">
    <script>
      (function() {
        function loadScript_(source) {
          return new Promise(function(resolve, reject) {
            var script = document.createElement("script");
            script.src = source;
            script.onload = resolve;
            script.onerror = function() {
              reject(new Error("Unable to load " + source));
            };
            document.head.appendChild(script);
          });
        }

        window.CENTRAL_STUDIO_FIREBASE_READY =
          loadScript_("/__/firebase/11.10.0/firebase-app-compat.js")
              .then(function() {
                return loadScript_(
                    "/__/firebase/11.10.0/firebase-auth-compat.js",
                );
              })
              .then(function() {
                return loadScript_(
                    "/__/firebase/11.10.0/firebase-firestore-compat.js",
                );
              })
              .then(function() {
                return loadScript_(
                    "/__/firebase/11.10.0/firebase-storage-compat.js",
                );
              })
              .then(function() {
                return loadScript_("/__/firebase/init.js");
              });
      }());
    </script>
    <script type="module" src="/studio.js"></script>
  </head>
  <body>
    <div id="studio-root">
      <noscript>Central Studio requires JavaScript.</noscript>
    </div>
  </body>
</html>
